profile: rtx6000
# RTX PRO 6000 Blackwell (96 GB): full-quality matrix. Long (likely 10+ hours) - run rtx6000_quick first.
steps: 30000
cap: 3000000
upscale_op: realesrgan # swap for a ComfyUI op (SeedVR2 / STAR) once built; keep realesrgan as the control arm
upscale_scale: 2
n_gens: 5
n_alt_paths: 4
path_frame_factor: 1.0
test_every: 8
real_weight: 0.5
seeds: [0, 1, 2]       # 3 seeds -> mean +/- spread (only the baseline uses extra seeds today)
fps: 10                # the truck video is 10 fps; set to your capture's frame rate for other videos
